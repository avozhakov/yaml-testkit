# A bean only _defaults.yaml names is skipped, with its stubs, in a variant whose context lacks it (design D20).
cases:
  - name: the defaults stub applies where the bean exists
    call: { bean: optionalFeature, method: name }
    expect: { returns: mocked }
  - name: a variant without the bean still starts
    context: eco
    call: { bean: modeService, method: mode }
    expect:
      returns: eco
      context:
        beans:
          absent: [ optionalFeature ]
