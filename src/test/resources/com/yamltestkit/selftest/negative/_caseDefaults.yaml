# Stubs applied before every negative http / bean case: an ad request finds placement 14019 and the dsp provider,
# passes enrichment unchanged and gets the two DSP ads of cases/data/dsp-two-ads.json (p1 without asin, p2 with asin
# B00SHOES); the tracking service answers every item with a click URL built from the item's id.
mocks:
  - { bean: placementAccess, method: getPlacement, returns: { valid: { id: 14019, availableSlots: 4 } } }
  - { bean: innerClient, method: blockedTerms, returns: [ ] }
  - { bean: pricingEnricher, method: enrich, returnsArg: 0 }
  - { bean: providerRegistry, method: find, args: [ dsp ], returns: { name: dsp, maxAds: 4 } }
  - { bean: dspClient, method: requestAds, returns: { file: ../cases/data/dsp-two-ads.json } }
http:
  - service: tracking
    method: POST
    path: /urls
    response:
      status: 200
      headers: { Content-Type: application/json }
      template: true
      body: >-
        {"urls": [{{#each (jsonPath request.body '$.items') as |item|}}{{#unless @first}}, {{/unless}}{"id":
        "{{item.id}}", "clickUrl": "https://click.example/{{item.id}}"}{{/each}}]}
